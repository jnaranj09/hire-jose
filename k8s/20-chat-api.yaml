apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-api
  namespace: hire-jose
  labels:
    app: chat-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-api
  template:
    metadata:
      labels:
        app: chat-api
    spec:
      # The image runs as uid 1000 and the token store is written at runtime.
      # Without this the local-path volume arrives root-owned and read-only to
      # the process, and the admin page cannot save anything.
      securityContext:
        fsGroup: 1000
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: chat-api-data
      containers:
        - name: chat-api
          # GitHub Actions builds this on every push and rewrites the tag on
          # this line, so the line itself is the deploy: ArgoCD sees the commit
          # and rolls it. Tagged by commit, never :latest, so whatever is
          # running can always be traced back to one.
          # scripts/load-images.sh still works for local hacking.
          image: ghcr.io/jnaranj09/hire-jose-chat-api:36ea0a6
          env:
            # ---- the demo switch ---------------------------------------
            # "default" = the dark palette. "paper" = the light one.
            # scripts/set-theme.sh changes this one word and pushes. So does
            # the assistant, when a visitor asks it to, through the GitHub
            # contents API — same line, same commit, same rollout.
            - name: SITE_THEME
              value: "default"
            # ------------------------------------------------------------
          envFrom:
            - configMapRef:
                name: chat-api-config
            # Created by hand, never in git — see k8s/README.md.
            - secretRef:
                name: chat-api-secrets
          volumeMounts:
            - name: data
              mountPath: /content/data
          ports:
            - name: http
              containerPort: 3000
            # The token admin page. Listed for documentation only — it is
            # deliberately NOT in the Service below and not in the tunnel, so
            # nothing outside the pod can route to it. Reach it with:
            #   kubectl -n hire-jose port-forward deploy/chat-api 3001:3001
            - name: admin
              containerPort: 3001
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chat-api
  namespace: hire-jose
spec:
  selector:
    app: chat-api
  ports:
    - name: http
      port: 3000
      targetPort: http
