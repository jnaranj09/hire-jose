apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-api-config
  namespace: hire-jose
data:
  # SITE_THEME is deliberately NOT here — it lives in the Deployment. A
  # change to a ConfigMap does not restart pods on its own, so putting the
  # demo switch in the pod spec is what makes the rollout automatic.
  HOST: "0.0.0.0"
  PORT: "3000"

  # Ollama stays on the host: the model is 4.7 GB and wants the laptop GPU,
  # which the k3s node cannot reach. 172.17.0.1 is the docker bridge, i.e.
  # the host as seen from inside the cluster.
  OLLAMA_URL: "http://172.17.0.1:11434"
  OLLAMA_MODEL: "hire-jose"

  CHAT_SESSION_TTL: "43200"

  # The token admin page. It binds inside the pod only, is not in the Service
  # and is not in the tunnel, so the one way in is a port-forward:
  #   kubectl -n hire-jose port-forward deploy/chat-api 3001:3001
  ADMIN_ENABLED: "true"
  ADMIN_HOST: "127.0.0.1"
  ADMIN_PORT: "3001"
  # Only used to build the link the page shows after creating a token.
  PUBLIC_SITE_URL: "https://demo.josenaranjo.website"

  MAX_REQUEST_LENGTH: "4000"
  MAX_ANSWER_SENTENCES: "4"
  RATE_LIMIT_REQUESTS: "20"
  RATE_LIMIT_WINDOW: "60"

  # The assistant can push the theme change itself. It edits the SITE_THEME
  # line in the file below, on GitHub, and ArgoCD deploys the commit. The
  # switch stays off until GITHUB_TOKEN is in the secret — see k8s/README.md.
  GITHUB_REPO: "jnaranj09/hire-jose"
  GITHUB_BRANCH: "main"
  THEME_MANIFEST_PATH: "k8s/20-chat-api.yaml"
  # One push per minute. ArgoCD needs longer than that to finish a rollout,
  # and two visitors asking at once should not fight over the branch.
  THEME_COOLDOWN: "60"

  # Handed to the visitor so they can watch the sync happen. The password is
  # ARGOCD_PASSWORD in the secret, not here.
  ARGOCD_URL: "https://argo.josenaranjo.website"
  ARGOCD_USERNAME: "viewer"
