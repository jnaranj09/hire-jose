# Applied once by hand. After this, everything under k8s/ in the GitHub repo
# is what the cluster runs — no kubectl apply in the loop.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hire-jose
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/jnaranj09/hire-jose.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: hire-jose

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        maxDuration: 1m
